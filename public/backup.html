<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Backup de Base de Datos</title>

  <!-- Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
</head>

<body class="bg-light">

  <!-- 🔒 Modal de clave maestra -->
  <div class="modal fade" id="masterKeyModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-3">

        <div class="modal-header">
          <h5 class="modal-title fw-bold">Acceso protegido</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <label class="form-label">Ingresa la clave maestra</label>
          <input 
            type="password" 
            class="form-control" 
            id="masterKeyInput"
            placeholder="••••••••" 
            required
          >
          <p id="keyError" class="text-danger mt-2 small"></p>
        </div>

        <div class="modal-footer">
          <button class="btn btn-primary w-100" id="verifyKeyBtn">
            Validar acceso
          </button>
        </div>

      </div>
    </div>
  </div>


  <div class="container mt-5" id="backupContent" style="display:none;">

    <!-- Título -->
    <div class="text-center mb-4">
      <h1 class="fw-bold">Backup del Sistema</h1>
      <p class="text-muted">Administra las copias de seguridad de la base de datos</p>
    </div>

    <div class="card shadow p-4 mx-auto" style="max-width: 600px;">

      <!-- Descargar -->
      <h4 class="mb-3">📤 Descargar Base de Datos</h4>
      <button class="btn btn-primary w-100 mb-4" onclick="descargarBackup()">
        Descargar Backup
      </button>

      <hr class="my-4">

      <!-- Restaurar -->
      <h4 class="mb-3">📥 Restaurar Base de Datos</h4>
      <input 
        type="file" 
        id="backupFile"
        class="form-control mb-3"
      >

      <button class="btn btn-success w-100" onclick="restaurarBackup()">
        Restaurar Backup
      </button>

      <!-- Mensajes -->
      <div
        id="msg"
        class="alert mt-4 d-none"
        role="alert"
      ></div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


  <script>
    // Detectar si es local o producción
    const isLocal = 
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1";

    const API_URL = isLocal 
      ? "http://localhost:3000/api/backup"
      : "https://cafecito-loyalty-program.onrender.com/api/backup";

    // ===============================
    // 🔐 Mostrar modal al cargar
    // ===============================
    document.addEventListener("DOMContentLoaded", () => {
      const modal = new bootstrap.Modal(document.getElementById("masterKeyModal"));
      modal.show();

      document.getElementById("verifyKeyBtn").addEventListener("click", verificarClave);
    });

    // ===============================
    // 🔐 Verificar clave maestra
    // ===============================
    async function verificarClave() {
      const key = document.getElementById("masterKeyInput").value.trim();
      const error = document.getElementById("keyError");

      if (!key) {
        error.textContent = "La clave no puede estar vacía.";
        return;
      }

      try {
        const res = await fetch(`${API_URL}/verify-key`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key })
        });

        if (!res.ok) {
          error.textContent = "Clave incorrecta.";
          return;
        }

        // ÉXITO -> mostrar contenido del panel
        document.getElementById("backupContent").style.display = "block";

        // Cerrar modal
        bootstrap.Modal.getInstance(document.getElementById("masterKeyModal")).hide();

      } catch (err) {
        error.textContent = "Error de conexión.";
      }
    }



    // ===============================
    // 📤 Descargar backup
    // ===============================
    async function descargarBackup() {
      const token = localStorage.getItem("token");
      if (!token) return showMsg("No hay token de sesión.", true);

      try {
        const res = await fetch(`${API_URL}/download`, {
          headers: { "Authorization": "Bearer " + token }
        });

        if (!res.ok) return showMsg("Error al descargar backup.", true);

        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "backup-fidelidad.db";
        a.click();

        showMsg("Backup descargado correctamente.");
      } catch (err) {
        showMsg("No se pudo descargar el backup.", true);
      }
    }

    // ===============================
    // 📥 Restaurar backup
    // ===============================
    async function restaurarBackup() {
      const file = document.getElementById("backupFile").files[0];

      if (!file) return showMsg("Selecciona un archivo primero.", true);

      const formData = new FormData();
      formData.append("dbfile", file);
      formData.append("restoreKey", "Cafecito2025Secret");

      try {
        const res = await fetch(`${API_URL}/restore`, {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (!res.ok) return showMsg(data.error || "Error restaurando.", true);

        showMsg("Base restaurada correctamente 🎉");
      } catch (err) {
        showMsg("Error subiendo el archivo.", true);
      }
    }

    // ===============================
    // Mensajes Bootstrap
    // ===============================
    function showMsg(text, isError = false) {
      const div = document.getElementById("msg");
      div.innerText = text;
      div.className = "alert mt-4 " + (isError ? "alert-danger" : "alert-success");
      div.classList.remove("d-none");
    }
  </script>

</body>
</html>
