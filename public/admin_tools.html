<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración</title>
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
</head>

<body class="bg-light">

<div class="container mt-5">

  <h1 class="text-center mb-4">🛠️ Panel de Administración</h1>

  <a href="index.html" class="btn btn-secondary mb-4">⬅️ Volver</a>

  <!-- Sección de Backup -->
  <div class="card p-4 shadow-sm mb-4">
    <h4>📦 Respaldo de Base de Datos</h4>
    <p class="text-muted">Genera un respaldo completo de la base de datos SQLite.</p>

    <button id="btnBackup" class="btn btn-primary">
      Generar Backup
    </button>
  </div>

  <!-- Sección de Restauración -->
  <div class="card p-4 shadow-sm">
    <h4>♻️ Restaurar Base de Datos</h4>
    <p class="text-muted">Carga un archivo .db para restaurar el sistema.</p>

    <input type="file" id="restoreFile" accept=".db" class="form-control mb-3">

    <button id="btnRestore" class="btn btn-danger">
      Restaurar Base de Datos
    </button>
  </div>

</div>

<script>
  window.API_BASE = window.location.origin.includes("localhost")
    ? "http://localhost:3000"
    : "https://cafecito-loyalty-program-production.up.railway.app";

  // Generar backup
  document.getElementById("btnBackup").addEventListener("click", () => {
    if (!confirm("¿Seguro que deseas crear un backup?")) return;

    window.location.href = `${window.API_BASE}/backup-db`;
  });

  // Restaurar backup
  document.getElementById("btnRestore").addEventListener("click", async () => {
    const file = document.getElementById("restoreFile").files[0];
    if (!file) return alert("Selecciona un archivo .db");

    const formData = new FormData();
    formData.append("dbfile", file);

    const res = await fetch(`${window.API_BASE}/restore-db`, {
      method: "POST",
      body: formData
    });

    const data = await res.json();
    alert(data.mensaje || "Listo");
  });

</script>

</body>
</html>
