<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Usuario - Sistema de Fidelidad</title>
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
</head>

<body class="d-flex align-items-center justify-content-center" 
      style="height: 100vh; background-color: #7aedfa;"> <!-- 💠 Turquesa -->

  <div class="card shadow p-4" style="width: 400px;">
    <h3 class="text-center fw-bold mb-3">Crear nuevo administrador</h3>
    <p class="text-muted text-center mb-4">Completa la información</p>

    <div>
      <label class="form-label">Nombre</label>
      <input type="text" id="nombre" class="form-control mb-3" placeholder="Juan Pérez">

      <label class="form-label">Correo electrónico</label>
      <input type="email" id="email" class="form-control mb-3" placeholder="admin@empresa.com">

      <label class="form-label">Contraseña</label>
      <input type="password" id="password" class="form-control mb-3" placeholder="••••••••">

      <label class="form-label">Clave maestra</label>
      <input type="password" id="masterKey" class="form-control mb-4" placeholder="Clave secreta">

      <button id="crearBtn" class="btn btn-primary w-100">Crear usuario</button>
      <button onclick="window.history.back()" class="btn btn-secondary w-100 mt-2">Volver</button>

      <p id="msg" class="text-center mt-3 text-danger small"></p>
    </div>
  </div>

  <script>
    const isLocal =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1";

    const apiBase = isLocal
      ? "http://localhost:3000"
      : "https://cafecito-loyalty-program-production.up.railway.app";

    document.getElementById("crearBtn").addEventListener("click", async () => {
      const nombre = document.getElementById("nombre").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const masterKey = document.getElementById("masterKey").value.trim();
      const msg = document.getElementById("msg");

      msg.textContent = "";

      if (!nombre || !email || !password || !masterKey) {
        msg.textContent = "Por favor completa todos los campos.";
        return;
      }

      try {
        const res = await fetch(`${apiBase}/api/users/create-admin`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nombre, email, password, masterKey }),
        });

        const data = await res.json();

        if (res.ok) {
          alert("✅ Usuario administrador creado correctamente.");
          window.location.href = "login.html";
        } else {
          msg.textContent = data.error || "Error al crear usuario.";
        }
      } catch (err) {
        console.error("❌ Error:", err);
        msg.textContent = "Error de conexión con el servidor.";
      }
    });
  </script>

</body>
</html>
