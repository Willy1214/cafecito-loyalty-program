<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Usuario</title>
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
</head>

<body class="d-flex align-items-center justify-content-center" 
      style="height: 100vh; background-color: #7aedfa;">

  <div class="card shadow p-4" style="width: 420px;">
    
    <h3 class="fw-bold text-center mb-3">Registrar nuevo usuario</h3>

    <form id="userForm">

      <label class="form-label">Nombre</label>
      <input type="text" id="nombre" class="form-control mb-3" required>

      <label class="form-label">Correo</label>
      <input type="email" id="email" class="form-control mb-3" required>

      <label class="form-label">Contraseña</label>
      <input type="password" id="password" class="form-control mb-3" required>

      <label class="form-label">Clave Maestra</label>
      <input type="password" id="masterKey" class="form-control mb-3" required>

      <button class="btn btn-primary w-100">Crear usuario</button>

      <p id="msg" class="text-danger mt-3 text-center small"></p>
    </form>
  </div>
   <script src="./resources/scripts/notifier.js"></script>
  <script>
    const isLocal =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1";

    const apiBase = isLocal
      ? "http://localhost:3000"
      : "https://cafecito-loyalty-program-production.up.railway.app";

    document.getElementById("userForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const masterKey = document.getElementById("masterKey").value.trim();
      const msg = document.getElementById("msg");

      msg.textContent = "";

      try {
        const res = await fetch(`${apiBase}/api/users/create-admin`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nombre, email, password, masterKey }),
        });

        const data = await res.json();

        if (res.ok) {
          notify("Usuario creado exitosamente", "success");

          setTimeout(() => {
            window.location.href = "login.html"; 
          }, 1500);
        } else {
          notify("Error al crear usuario", "danger");
        }
      } catch (err) {
        msg.textContent = "Error de conexión con el servidor.";
        console.error(err);
      }
    });
  </script>

</body>
</html>
