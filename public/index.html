<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Fidelidad - Cafecito del Parque ☕</title>
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
</head>
<body class="bg-light">

  <div class="container mt-5 position-relative">

    <!-- Botón de logout colocado arriba a la derecha SIN mover el contenido -->
    <button 
      id="logoutBtn"
      class="btn btn-danger btn-sm position-absolute"
      style="top: -40px; right: 0;"
    >
      Cerrar sesión
    </button>

    <!-- Encabezado centrado -->
    <div class="text-center mb-4">
      <img 
        src="./resources/img/logo_cafecito.jpg" 
        alt="Logo Cafecito del Parque" 
        width="180" 
        height="180" 
        class="mb-3 rounded-circle shadow-sm mx-auto d-block"
        style="object-fit: cover;"
      >
      <h1 class="fw-bold">Cafecito del Parque</h1>
      <h4 class="text-muted">Sistema de puntos</h4>
    </div>

    <!-- Filtro -->
    <div class="card p-3 mb-4 shadow-sm">
      <h5 class="mb-3">🔍 Buscar cliente</h5>
      <input 
        id="searchInput"
        type="text"
        class="form-control"
        placeholder="Buscar por nombre o ID..."
      >
    </div>

    <!-- Agregar cliente -->
    <div class="card p-4 mb-4 shadow-sm">
      <h4 class="mb-3">Agregar cliente</h4>
      <div class="input-group">
        <input 
          id="name" 
          type="text" 
          class="form-control" 
          placeholder="Nombre del cliente"
        >
        <button id="addBtn" class="btn btn-success">Agregar</button>
      </div>
    </div>

    <!-- Lista de clientes -->
    <div class="card p-4 shadow-sm">
      <h4 class="mb-3">👥 Clientes</h4>
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Puntos</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="customerTable">
          <tr><td colspan="4" class="text-center text-muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 🔥 Botón para ir al panel de backups -->
    <div class="text-center mt-4 mb-4">
      <a href="backup.html" class="btn btn-outline-primary">
        📦 Ir al panel de Backups
      </a>
    </div>

  </div>

  <!-- 🌐 Detecta entorno -->
  <script>
    window.API_BASE = window.location.origin.includes("localhost")
      ? "http://localhost:3000"
      : "https://cafecito-loyalty-program-production.up.railway.app";
  </script>

  <!-- 💬 Notificador -->
  <script src="./resources/scripts/confirm.js"></script>
  <script src="./resources/scripts/notifier.js"></script>

  <!-- 📱 Lógica principal -->
  <script src="app.js"></script>

</body>
</html>
