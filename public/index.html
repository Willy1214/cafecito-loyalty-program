<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loyalty System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-4">
    <h1 class="text-center mb-4">🪙 Customer Loyalty System</h1>

    <!-- Add Customer -->
    <div class="card p-3 mb-4 shadow-sm">
      <h4>Add Customer</h4>
      <div class="input-group">
        <input id="name" type="text" class="form-control" placeholder="Customer name">
        <button id="addBtn" class="btn btn-success">Add</button>
      </div>
    </div>

    <!-- Customer List -->
    <div class="card p-3 shadow-sm">
      <h4>Customers</h4>
      <table class="table table-striped mt-3">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Points</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="customerTable"></tbody>
      </table>
    </div>
  </div>

  <!-- 🌐 Detecta el entorno antes de cargar app.js -->
  <script>
    window.API_BASE = window.location.origin.includes("localhost")
      ? "http://localhost:3000"
      : "https://cafecito-loyalty-program-production.up.railway.app";
  </script>

  <script src="app.js"></script>
</body>
</html>
