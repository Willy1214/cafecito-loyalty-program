<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Fidelidad - Cafecito del Parque ☕</title>
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
</head>
<body class="bg-light">

  <div class="container mt-5">
    <!-- Encabezado con logo -->
    <div class="text-center mb-4">
      <img 
        src="img/logo_cafecito.jpg" 
        alt="Logo Cafecito del Parque" 
        width="180" 
        height="180" 
        class="mb-3 rounded-circle shadow-sm"
      >
      <h1 class="fw-bold">Cafecito del Parque</h1>
      <h4 class="text-muted">Customer Loyalty System</h4>
    </div>

    <!-- Agregar cliente -->
    <div class="card p-4 mb-4 shadow-sm">
      <h4 class="mb-3">Agregar cliente</h4>
      <div class="input-group">
        <input 
          id="name" 
          type="text" 
          class="form-control" 
          placeholder="Customer name"
        >
        <button id="addBtn" class="btn btn-success">Agregar</button>
      </div>
    </div>

    <!-- Lista de clientes -->
    <div class="card p-4 shadow-sm">
      <h4 class="mb-3">👥 Clientes</h4>
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Puntos</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="customerTable">
          <tr><td colspan="4" class="text-center text-muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 🌐 Detecta entorno antes de cargar app.js -->
  <script>
    window.API_BASE = window.location.origin.includes("localhost")
      ? "http://localhost:3000"
      : "https://cafecito-loyalty-program-production.up.railway.app";
  </script>

  <script src="app.js"></script>
</body>
</html>
