<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Fidelidad - Cafecito del Parque</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

  <div class="container mt-4">
    
    <!-- Header con bienvenida y logout -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <!-- Bienvenida -->
      <div>
        <span class="text-muted">
          <i class="bi bi-person-circle me-2"></i>
          <span id="welcomeMessage">Cargando...</span>
        </span>
      </div>
      
      <!-- Logout -->
      <button 
        id="logoutBtn"
        class="btn btn-outline-danger btn-sm"
      >
        <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
      </button>
    </div>

    <!-- Encabezado centrado -->
    <div class="text-center mb-5">
      <div class="d-flex justify-content-center mb-3">
        <img 
          src="./resources/img/logo_cafecito.jpg" 
          alt="Logo Cafecito del Parque" 
          class="rounded-circle border border-4 border-white shadow"
          width="140"
          height="140"
          style="object-fit: cover;"
        >
      </div>
      <h1 class="fw-bold">Cafecito del Parque</h1>
      <h4 class="text-muted">Sistema de puntos</h4>
    </div>

    <!-- Agregar cliente -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body">
        <h4 class="card-title mb-3">
          <i class="bi bi-person-plus me-2"></i>Agregar cliente
        </h4>
        <div class="input-group">
          <input 
            id="name" 
            type="text" 
            class="form-control" 
            placeholder="Nombre del cliente"
            autofocus
          >
          <button id="addBtn" class="btn btn-success">
            <i class="bi bi-plus-circle me-1"></i>Agregar
          </button>
        </div>
      </div>
    </div>

    <!-- Lista de clientes -->
    <div class="card shadow-sm border-0">
      <div class="card-body">
        
        <!-- Header con título y búsqueda -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-3 gap-3">
          <div>
            <h4 class="mb-0">
              <i class="bi bi-people-fill me-2"></i>Clientes
            </h4>
          </div>

          <!-- Búsqueda -->
          <div class="w-100 w-md-auto" style="min-width: 250px; max-width: 420px;">
            <div class="input-group input-group-sm">
              <span class="input-group-text">
                <i class="bi bi-search"></i>
              </span>
              <input 
                id="searchInput"
                type="text"
                class="form-control"
                placeholder="Buscar por nombre o ID..."
                aria-label="Buscar clientes"
              >
              <button id="clearSearchBtn" class="btn btn-outline-secondary" type="button" title="Limpiar búsqueda">
                <i class="bi bi-x-lg"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Tabla de clientes -->
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th class="fw-semibold">ID</th>
                <th class="fw-semibold">Nombre</th>
                <th class="fw-semibold text-center">Puntos</th>
                <th class="fw-semibold text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="customerTable">
              <tr>
                <td colspan="4" class="text-center py-4">
                  <div class="spinner-border spinner-border-sm text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
                  </div>
                  <span class="text-muted ms-2">Cargando clientes...</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>

    <!-- Botón para ir al panel de backups -->
    <div class="text-center mt-4 pt-3">
      <a id="backupAccessBtn" href="backup.html" class="btn btn-outline-primary">
        <i class="bi bi-database me-2"></i>Panel de Backups
      </a>
    </div>

  </div>

  <!-- 🌐 Detecta entorno -->
  <script>
    window.API_BASE = window.location.origin.includes("localhost")
      ? "http://localhost:3000"
      : "https://cafecito-loyalty-program.onrender.com";
  </script>

  <!-- Recursos -->
  <script src="./resources/scripts/confirm.js"></script>
  <script src="./resources/scripts/notifier.js"></script>
  <script src="./resources/scripts/input_dialog.js"></script>
  <script src="./resources/scripts/backup_access.js"></script>

  <!-- 📱 Lógica principal -->
  <script src="app.js"></script>

  <script>
    // Configuración inicial
    document.addEventListener('DOMContentLoaded', function() {
      // Mostrar bienvenida con nombre de usuario
      showWelcomeMessage();
      
      // Configurar otros event listeners
      setupEventListeners();
    });

    // Mostrar mensaje de bienvenida
    function showWelcomeMessage() {
      const welcomeElement = document.getElementById('welcomeMessage');
      try {
        const usuario = localStorage.getItem('usuario');
        if (usuario) {
          const userData = JSON.parse(usuario);
          const nombre = userData.nombre || userData.email || 'Usuario';
          welcomeElement.textContent = `Bienvenido, ${nombre}`;
        } else {
          welcomeElement.textContent = 'Bienvenido';
        }
      } catch (error) {
        console.log('Error cargando datos de usuario:', error);
        welcomeElement.textContent = 'Bienvenido';
      }
    }

    // Configurar event listeners
    function setupEventListeners() {
      // Limpiar búsqueda
      document.getElementById("clearSearchBtn").addEventListener("click", () => {
        const inp = document.getElementById("searchInput");
        inp.value = "";
        inp.dispatchEvent(new Event('input', { bubbles: true }));
      });

      // Configurar logout
      document.getElementById("logoutBtn").addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        
        if (typeof window.handleLogout === 'function') {
          window.handleLogout();
        }
      });

      // Enter para agregar cliente
      document.getElementById("name").addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          document.getElementById("addBtn").click();
        }
      });

      // Auto-focus en el campo de nombre
      document.getElementById('name').focus();
    }
  </script>

</body>
</html>
