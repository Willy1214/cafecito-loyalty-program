<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión - Sistema de Fidelidad</title>
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
</head>

<body class="d-flex align-items-center justify-content-center" 
      style="height: 100vh; background-color: #7aedfa;"> <!-- 💠 Turquesa -->

  <div class="card shadow p-4 text-center" style="width: 380px;">

    <!-- 🖼️ Logo -->
    <img 
      src="resources/img/logo_cafecito.jpg" 
      alt="Logo Cafecito del Parque" 
      width="120" 
      height="120" 
      class="mx-auto mb-3 rounded-circle shadow-sm"
    >

    <h3 class="mb-3 fw-bold">Cafecito del Parque</h3>
    <h5 class="text-muted mb-4">Sistema de Fidelidad</h5>

    <!-- Campos -->
    <div class="text-start">
      <label for="email" class="form-label">Correo electrónico</label>
      <input 
        type="email" 
        id="email" 
        class="form-control mb-3" 
        placeholder="admin@empresa.com"
      >

      <label for="password" class="form-label">Contraseña</label>
      <input 
        type="password" 
        id="password" 
        class="form-control mb-3" 
        placeholder="••••••••"
      >

      <button id="loginBtn" class="btn btn-primary w-100">Entrar</button>

      <button 
        id="createUserBtn" 
        class="btn btn-outline-secondary w-100 mt-2"
      >
        Crear usuario
      </button>

      <!-- 🌟 Nuevo botón para backups -->
      <a 
        href="backup.html" 
        class="btn btn-outline-dark w-100 mt-3"
      >
        📦 Cargar copia de seguridad
      </a>

      <p id="msg" class="text-center mt-3 text-danger small"></p>
    </div>
  </div>

  <script>
    // 🌐 Detecta entorno
    const isLocal =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1";

    const apiBase = isLocal
      ? "http://localhost:3000"
      : "https://cafecito-loyalty-program-production.up.railway.app";

    const apiURL = `${apiBase}/api/users/login`;

    // 🔐 Login
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");

      msg.textContent = "";

      if (!email || !password) {
        msg.textContent = "Por favor ingresa tus credenciales.";
        return;
      }

      try {
        const res = await fetch(apiURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("usuario", JSON.stringify(data.usuario));
          window.location.href = "index.html";
        } else {
          msg.textContent = data.error || "Credenciales incorrectas.";
        }
      } catch (err) {
        msg.textContent = "Error de conexión con el servidor.";
        console.error("❌ Error:", err);
      }
    });

    // 👤 Crear usuario admin
    document.getElementById("createUserBtn").addEventListener("click", () => {
      window.location.href = "new_user.html";
    });
  </script>
</body>
</html>
