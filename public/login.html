<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión - Sistema de Fidelidad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

  <div class="card shadow p-4" style="width: 360px;">
    <h3 class="text-center mb-3">🔐 Iniciar Sesión</h3>
    
    <div class="mb-3">
      <label for="email" class="form-label">Correo</label>
      <input type="email" id="email" class="form-control" placeholder="admin@empresa.com">
    </div>
    
    <div class="mb-3">
      <label for="password" class="form-label">Contraseña</label>
      <input type="password" id="password" class="form-control" placeholder="••••••••">
    </div>
    
    <button id="loginBtn" class="btn btn-primary w-100">Entrar</button>
    
    <p id="msg" class="text-center mt-3 text-danger"></p>
  </div>

  <script>
    const apiURL = "http://localhost:3000/api/users/login";

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");

      msg.textContent = "";

      if (!email || !password) {
        msg.textContent = "Por favor ingresa tus credenciales.";
        return;
      }

      try {
        const res = await fetch(apiURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("usuario", JSON.stringify(data.usuario));
          window.location.href = "index.html";
        } else {
          msg.textContent = data.error || "Credenciales incorrectas.";
        }
      } catch (err) {
        msg.textContent = "Error de conexión con el servidor.";
        console.error(err);
      }
    });
  </script>

</body>
</html>
