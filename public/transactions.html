<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial de transacciones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-4">
    <h1 class="text-center mb-4">📜 Historial de transacciones</h1>

    <!-- Tabla de transacciones -->
    <div class="card p-3 shadow-sm">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Fecha</th>
            <th>Puntos</th>
            <th>Motivo</th>
          </tr>
        </thead>
        <tbody id="transactionsTable">
          <tr><td colspan="5" class="text-center text-muted">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // =======================
    // 🌐 Detectar entorno (local o producción)
    // =======================
    const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    const API_BASE = isLocal
      ? "http://localhost:3000"
      : "https://cafecito-loyalty-program.onrender.com";

    // =======================
    // 🔐 Verificar sesión activa
    // =======================
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "login.html";
    }

    // =======================
    // 🚪 Botón de cerrar sesión
    // =======================
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.querySelector(".container");
      if (container) {
        const logoutBtn = document.createElement("button");
        logoutBtn.textContent = "Cerrar sesión";
        logoutBtn.className = "btn btn-danger btn-sm float-end";
        logoutBtn.onclick = () => {
          localStorage.removeItem("token");
          localStorage.removeItem("usuario");
          localStorage.removeItem("clienteId");
          window.location.href = "login.html";
        };
        container.prepend(logoutBtn);
      }
    });

    // =======================
    // 🔄 Cargar transacciones
    // =======================
    const clienteId = localStorage.getItem("clienteId");
    const apiURL = clienteId
      ? `${API_BASE}/api/transactions/cliente/${clienteId}`
      : `${API_BASE}/api/transactions`;

    async function loadTransactions() {
      try {
        const res = await fetch(apiURL, {
          headers: {
            "Authorization": `Bearer ${token}`,
          },
        });

        const table = document.getElementById("transactionsTable");

        if (res.status === 401 || res.status === 403) {
          alert("⚠️ Tu sesión ha expirado. Inicia sesión nuevamente.");
          localStorage.clear();
          window.location.href = "login.html";
          return;
        }

        if (!res.ok) throw new Error("HTTP " + res.status);

        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          table.innerHTML = `<tr><td colspan="5" class="text-center text-muted">Sin transacciones registradas.</td></tr>`;
          return;
        }

        table.innerHTML = data.map(t => `
          <tr>
            <td>${t.id}</td>
            <td>${t.cliente_nombre || "—"}</td>
            <td>${new Date(t.fecha).toLocaleString()}</td>
            <td class="${t.puntos >= 0 ? 'text-success fw-bold' : 'text-danger fw-bold'}">${t.puntos}</td>
            <td>${t.motivo}</td>
          </tr>
        `).join("");

      } catch (err) {
        console.error("❌ Error cargando transacciones:", err);
        document.getElementById("transactionsTable").innerHTML =
          `<tr><td colspan="5" class="text-center text-danger">Error al cargar datos.</td></tr>`;
      }
    }

    loadTransactions();
  </script>
</body>
</html>
