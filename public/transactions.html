<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial de transacciones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">
  
  <div class="container mt-4">
    
    <!-- Header con bienvenida y logout -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <!-- Bienvenida -->
      <div>
        <span class="text-muted">
          <i class="bi bi-person-circle me-2"></i>
          <span id="welcomeMessage">Cargando...</span>
        </span>
      </div>
      
      <!-- Logout -->
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">
        <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
      </button>
    </div>

    <!-- Título principal -->
    <h1 class="text-center mb-4">
      <i class="bi bi-receipt me-2"></i>Historial de transacciones
    </h1>

    <!-- Tarjeta con tabla -->
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th class="fw-semibold">ID</th>
                <th class="fw-semibold">Cliente</th>
                <th class="fw-semibold">Fecha</th>
                <th class="fw-semibold text-center">Puntos</th>
                <th class="fw-semibold">Motivo</th>
                <th class="fw-semibold">Realizado por</th> <!-- NUEVA COLUMNA -->
              </tr>
            </thead>
            <tbody id="transactionsTable">
              <tr>
                <td colspan="6" class="text-center py-4"> <!-- Cambiado a colspan="6" -->
                  <div class="spinner-border spinner-border-sm text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
                  </div>
                  <span class="text-muted ms-2">Cargando transacciones...</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Botón para volver -->
    <div class="text-center mt-4">
      <button id="backBtn" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-2"></i>Volver al inicio
      </button>
    </div>

  </div>

  <script>
    // =======================
    // 🌐 Detectar entorno (local o producción)
    // =======================
    const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    const API_BASE = isLocal
      ? "http://localhost:3000"
      : "https://cafecito-loyalty-program.onrender.com";

    // =======================
    // 🔐 Verificar sesión activa
    // =======================
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "login.html";
    }

    // =======================
    // 👤 Mostrar bienvenida con nombre de usuario
    // =======================
    function showWelcomeMessage() {
      const welcomeElement = document.getElementById('welcomeMessage');
      try {
        const usuario = localStorage.getItem('usuario');
        if (usuario) {
          const userData = JSON.parse(usuario);
          const nombre = userData.nombre || userData.email || 'Usuario';
          welcomeElement.textContent = `Bienvenido, ${nombre}`;
        } else {
          welcomeElement.textContent = 'Bienvenido';
        }
      } catch (error) {
        console.log('Error cargando datos de usuario:', error);
        welcomeElement.textContent = 'Bienvenido';
      }
    }

    // =======================
    // 🚀 Cargar datos
    // =======================
    const clienteId = localStorage.getItem("clienteId");
    const apiURL = clienteId
      ? `${API_BASE}/api/transactions/cliente/${clienteId}`
      : `${API_BASE}/api/transactions`;

    // =======================
    // 📊 Función principal para cargar transacciones
    // =======================
    async function loadTransactions() {
      try {
        const res = await fetch(apiURL, {
          headers: {
            "Authorization": `Bearer ${token}`,
          },
        });

        const table = document.getElementById("transactionsTable");

        if (res.status === 401 || res.status === 403) {
          alert("⚠️ Tu sesión ha expirado. Inicia sesión nuevamente.");
          localStorage.clear();
          window.location.href = "login.html";
          return;
        }

        if (!res.ok) throw new Error("HTTP " + res.status);

        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          table.innerHTML = `
            <tr>
              <td colspan="6" class="text-center py-5">
                <i class="bi bi-receipt text-muted fs-4 d-block mb-2"></i>
                <span class="text-muted">Sin transacciones registradas.</span>
              </td>
            </tr>
          `;
          return;
        }

        table.innerHTML = data.map(t => `
          <tr>
            <td class="text-muted small">${t.id}</td>
            <td class="fw-medium">${t.cliente_nombre || "Cliente desconocido"}</td>
            <td class="small">${formatDate(t.fecha)}</td>
            <td class="text-center">
              <span class="badge ${t.puntos >= 0 ? 'bg-success' : 'bg-danger'}">
                ${t.puntos >= 0 ? '+' : ''}${t.puntos}
              </span>
            </td>
            <td>${t.motivo}</td>
            <td class="small text-muted">
              ${t.usuario_nombre ? `<i class="bi bi-person-fill me-1"></i>${t.usuario_nombre}` : '<span class="text-muted">Sistema</span>'}
            </td> <!-- NUEVA COLUMNA: Usuario que realizó -->
          </tr>
        `).join("");

      } catch (err) {
        console.error("❌ Error cargando transacciones:", err);
        document.getElementById("transactionsTable").innerHTML = `
          <tr>
            <td colspan="6" class="text-center py-5">
              <i class="bi bi-exclamation-triangle text-danger me-2"></i>
              <span class="text-danger">Error al cargar datos.</span>
              <br>
              <button class="btn btn-sm btn-outline-primary mt-2" onclick="loadTransactions()">
                <i class="bi bi-arrow-clockwise me-1"></i>Reintentar
              </button>
            </td>
          </tr>
        `;
      }
    }

    // =======================
    // 📅 Formatear fecha
    // =======================
    function formatDate(dateString) {
      try {
        const date = new Date(dateString);
        return date.toLocaleDateString('es-ES', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (e) {
        return dateString;
      }
    }

    // =======================
    // 🚪 Cerrar sesión (usando tu confirm.js)
    // =======================
    async function logout() {
      // Usar tu confirm.js que ya tienes implementado
      if (typeof confirmDialog === 'function') {
        const ok = await confirmDialog("¿Seguro que deseas cerrar sesión?");
        if (!ok) return;
      } else {
        // Fallback si confirm.js no está disponible
        if (!confirm("¿Estás seguro de que deseas cerrar sesión?")) return;
      }
      
      localStorage.removeItem("token");
      localStorage.removeItem("usuario");
      localStorage.removeItem("clienteId");
      window.location.href = "login.html";
    }

    // =======================
    // 🎯 Configurar eventos cuando el DOM esté listo
    // =======================
    document.addEventListener("DOMContentLoaded", () => {
      // Mostrar bienvenida
      showWelcomeMessage();
      
      // Cargar transacciones
      loadTransactions();
      
      // Configurar logout (usando tu función si existe)
      document.getElementById("logoutBtn").addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        
        // Usar tu función de logout si está definida globalmente
        if (typeof window.logout === 'function') {
          window.logout();
        } else {
          // Si no existe, usar la local
          logout();
        }
      });
      
      // Configurar botón de volver
      document.getElementById("backBtn").addEventListener("click", () => {
        window.history.back();
      });
    });
  </script>
  
  <!-- Recursos (igual que en index.html) -->
  <script src="./resources/scripts/confirm.js"></script>
  <script src="./resources/scripts/notifier.js"></script>
</body>
</html>
